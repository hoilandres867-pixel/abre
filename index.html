<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Miau 🌼</title>
<style>
:root{--ink:#3f392f;--soft:#fffaf0;--yellow:#f5c928;--yellow2:#ffe56a;--green:#66834e}
*{box-sizing:border-box} body{margin:0;min-height:100svh;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at 50% 25%,#fffef8 0,#fff9e8 45%,#f8edcf 100%);overflow:hidden}
main{min-height:100svh;display:grid;place-items:center;padding:24px}.card{text-align:center;width:min(94vw,520px);position:relative;z-index:5}
h1{font-size:clamp(30px,8vw,48px);font-weight:500;margin:0 0 12px}.lead{font-size:18px;line-height:1.55;margin:0 auto 24px;max-width:360px}
button{border:0;border-radius:999px;padding:14px 24px;font:600 16px system-ui,sans-serif;background:#473d2c;color:white;box-shadow:0 8px 24px #5d4d3028;cursor:pointer}.hide{display:none!important}.sound{position:fixed;right:18px;top:18px;z-index:30;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;background:#fff9;border:1px solid #d8c9a7;color:#514735;backdrop-filter:blur(8px);box-shadow:0 6px 20px #5d4d3018}.sound.muted{opacity:.55}
.stage{position:fixed;inset:0;pointer-events:none}.flower{position:absolute;left:50%;top:58%;width:58px;height:58px;opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg);transition:1s cubic-bezier(.2,.8,.2,1)}
.flower.show{opacity:1;transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(var(--r))}.stem{position:absolute;width:5px;height:260px;background:linear-gradient(#79985c,#52733e);border-radius:5px;left:27px;top:45px;transform-origin:top;z-index:-2}.petal{position:absolute;width:27px;height:38px;background:radial-gradient(circle at 50% 20%,var(--yellow2),var(--yellow));border-radius:55% 55% 48% 48%;left:16px;top:8px;transform-origin:50% 21px}.petal:nth-child(1){transform:rotate(0) translateY(-16px)}.petal:nth-child(2){transform:rotate(60deg) translateY(-16px)}.petal:nth-child(3){transform:rotate(120deg) translateY(-16px)}.petal:nth-child(4){transform:rotate(180deg) translateY(-16px)}.petal:nth-child(5){transform:rotate(240deg) translateY(-16px)}.petal:nth-child(6){transform:rotate(300deg) translateY(-16px)}.center{position:absolute;width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a6530,#5b431f);left:17px;top:16px;z-index:2}
.wrap{position:fixed;left:50%;bottom:-280px;transform:translateX(-50%);width:310px;height:280px;transition:1.2s ease;z-index:2}.wrap.show{bottom:-25px}.paper{position:absolute;inset:0;clip-path:polygon(10% 0,90% 0,70% 100%,30% 100%);background:linear-gradient(135deg,#f1dfb9,#fff4da 50%,#dfc89e);filter:drop-shadow(0 10px 15px #0002)}.ribbon{position:absolute;left:50%;top:135px;transform:translateX(-50%);width:86px;height:24px;border-radius:50%;background:#c9a35c}.ribbon:before,.ribbon:after{content:"";position:absolute;width:55px;height:65px;background:#c9a35c;top:10px;clip-path:polygon(0 0,100% 20%,55% 100%)}.ribbon:before{right:40px;transform:rotate(20deg)}.ribbon:after{left:40px;transform:scaleX(-1) rotate(20deg)}
.msg{position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(8px);width:min(86vw,440px);font-size:clamp(20px,5.5vw,28px);line-height:1.35;text-align:center;opacity:0;transition:.55s;z-index:8;text-shadow:0 2px 10px #fff}.msg.on{opacity:1;transform:translateX(-50%) translateY(0)}
.final{position:fixed;inset:0;display:grid;align-content:start;justify-items:center;padding-top:9vh;opacity:0;pointer-events:none;transition:1s;z-index:10;background:linear-gradient(#fffaf0dd 0,#fffaf055 38%,transparent 60%)}.final.on{opacity:1}.final h2{font-size:clamp(28px,7vw,42px);font-weight:500;margin:0 18px 8px}.final p{font-size:18px;margin:5px}.sig{margin-top:10px!important;font-style:italic}.cat{position:fixed;left:calc(50% + 83px);bottom:178px;width:56px;height:48px;background:#9b8b7b;border-radius:50% 50% 45% 45%;z-index:4;opacity:0;transition:.8s}.cat.on{opacity:1}.cat:before,.cat:after{content:"";position:absolute;top:-10px;width:20px;height:22px;background:#9b8b7b;clip-path:polygon(50% 0,100% 100%,0 100%)}.cat:before{left:4px}.cat:after{right:4px}.eyes{position:absolute;left:12px;top:18px;width:7px;height:7px;background:#28231f;border-radius:50%;box-shadow:25px 0 #28231f}.catmouth{position:absolute;left:25px;top:29px;width:8px;height:5px;border-bottom:2px solid #4a4038;border-radius:50%}
.spark{position:fixed;font-size:22px;animation:float 3.2s ease-out forwards;z-index:1}@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translateY(-130px) rotate(25deg) scale(1.1)}}
.hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:12;font:500 13px system-ui,sans-serif;letter-spacing:.02em;color:#675c49;opacity:0;transition:.5s;white-space:nowrap}.hint.on{opacity:.8}.progress{position:fixed;left:50%;top:24px;transform:translateX(-50%);display:flex;gap:7px;z-index:12;opacity:0;transition:.5s}.progress.on{opacity:1}.dot{width:6px;height:6px;border-radius:50%;background:#cdbf9d;transition:.4s}.dot.active{width:20px;border-radius:9px;background:#c6a247}.veil{position:fixed;inset:0;background:radial-gradient(circle at 50% 58%,transparent 0 24%,#fff9e85c 65%,#f5e7c599 100%);pointer-events:none;z-index:0}.petalfall{position:fixed;top:-30px;z-index:1;pointer-events:none;opacity:.6;animation:fall var(--dur) linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(520deg);opacity:.05}}.msg{padding:10px 18px}.msg.on{animation:softIn .6s ease both}@keyframes softIn{from{filter:blur(4px);letter-spacing:.02em}to{filter:blur(0);letter-spacing:0}}.flower.show{animation:breathe 5s ease-in-out 1.1s infinite alternate}@keyframes breathe{to{filter:brightness(1.035);margin-top:-2px}}.bouquetGlow{position:fixed;left:50%;bottom:70px;width:330px;height:330px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe78135,transparent 68%);opacity:0;transition:1.2s;z-index:0;pointer-events:none}.bouquetGlow.on{opacity:1}.final h2,.final p{opacity:0;transform:translateY(8px)}.final.on h2{animation:reveal .8s .25s forwards}.final.on p:nth-of-type(1){animation:reveal .8s .62s forwards}.final.on p:nth-of-type(2){animation:reveal .8s .92s forwards}.final.on .sig{animation:reveal .8s 1.22s forwards}.day{font-size:16px!important;margin-top:10px!important;color:#79673f}@keyframes reveal{to{opacity:1;transform:none}}
@media(max-height:650px){.flower{top:55%}.wrap{height:230px}.wrap.show{bottom:-55px}.cat{bottom:135px}.final{padding-top:5vh}}
</style></head>
<body><main><section class="card" id="intro"><h1>Buenos días, Miau. 🌼</h1><p class="lead">Tengo algo para ti.</p><button id="start">Comenzar ♫</button></section></main>
<audio id="music" preload="auto" loop src="musica.mp3"></audio><button id="sound" class="sound hide" aria-label="Silenciar música">♫</button><div class="veil"></div><div class="bouquetGlow" id="glow"></div><div class="progress" id="progress"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="stage" id="stage"></div><div class="msg" id="msg"></div><div class="hint" id="hint">Toca la pantalla para continuar 🌼</div>
<div class="wrap" id="wrap"><div class="paper"></div><div class="ribbon"></div></div><div class="cat" id="cat"><i class="eyes"></i><i class="catmouth"></i></div>
<section class="final" id="final"><h2>Estas son para ti, Naila. 🌼</h2><p class="day">Feliz Día de las Flores Amarillas, Miau. 🌼</p><p>Que tengas un día muy bonito. ♡</p><p class="sig">— Sir Gustav</p></section>
<script>
const phrases=["Para tus ojitos bonitos.","Para esa sonrisa que me encanta ver.","Para acompañarte un ratito esta mañana.","Y porque hoy también mereces algo bonito."];
const music=document.querySelector('#music'),sound=document.querySelector('#sound');
const stage=document.querySelector('#stage'),msg=document.querySelector('#msg'),wrap=document.querySelector('#wrap'),cat=document.querySelector('#cat'),final=document.querySelector('#final'),hint=document.querySelector('#hint'),progress=document.querySelector('#progress'),glow=document.querySelector('#glow'),dots=[...document.querySelectorAll('.dot')];
const positions=[[-92,-80,.9,-12],[-38,-115,1.05,4],[25,-110,.95,-3],[80,-72,.9,11],[-120,-20,.85,-18],[-62,-45,1,7],[0,-55,1.12,0],[60,-38,1,-6],[115,-8,.82,15],[-85,15,.88,-9],[-25,5,1.02,5],[38,12,.94,-5],[88,30,.82,10]];
let idx=0,step=-1,busy=false,started=false;
function flower(i){const d=document.createElement('div');d.className='flower';d.style.setProperty('--x',`${positions[i][0]-29}px`);d.style.setProperty('--y',`${positions[i][1]-29}px`);d.style.setProperty('--s',positions[i][2]);d.style.setProperty('--r',`${positions[i][3]}deg`);d.innerHTML='<div class="stem"></div>'+Array(6).fill('<i class="petal"></i>').join('')+'<i class="center"></i>';stage.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'))}
function ambientPetal(){if(!started||final.classList.contains('on'))return;const e=document.createElement('span');e.className='petalfall';e.textContent='❀';e.style.left=Math.random()*100+'vw';e.style.fontSize=(10+Math.random()*9)+'px';e.style.setProperty('--dur',(6+Math.random()*4)+'s');e.style.setProperty('--drift',(-70+Math.random()*140)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),10500)}
function sparkle(){for(let i=0;i<16;i++){let s=document.createElement('span');s.className='spark';s.textContent=i%3?'✦':'♡';s.style.left=(10+Math.random()*80)+'vw';s.style.top=(55+Math.random()*28)+'vh';s.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function updateDots(n){dots.forEach((d,i)=>d.classList.toggle('active',i===n))}
async function showPhrase(n){busy=true;msg.classList.remove('on');await new Promise(r=>setTimeout(r,180));msg.textContent=phrases[n];msg.classList.add('on');for(let j=0;j<3 && idx<12;j++){flower(idx++);await new Promise(r=>setTimeout(r,150))}hint.classList.add('on');busy=false}
async function finish(){busy=true;hint.classList.remove('on');msg.classList.remove('on');updateDots(4);await new Promise(r=>setTimeout(r,350));if(idx<13)flower(idx++);glow.classList.add('on');wrap.classList.add('show');sparkle();await new Promise(r=>setTimeout(r,950));cat.classList.add('on');await new Promise(r=>setTimeout(r,800));progress.classList.remove('on');final.classList.add('on');busy=false}
async function next(){if(!started||busy||final.classList.contains('on'))return;step++;if(step<4){updateDots(step);await showPhrase(step)}else await finish()}
async function begin(){started=true;document.querySelector('#intro').classList.add('hide');sound.classList.remove('hide');try{music.volume=.42;await music.play()}catch(e){}progress.classList.add('on');setInterval(ambientPetal,850);await new Promise(r=>setTimeout(r,350));next()}
sound.addEventListener('click',e=>{e.stopPropagation();music.muted=!music.muted;sound.classList.toggle('muted',music.muted);sound.textContent=music.muted?'♩':'♫';sound.setAttribute('aria-label',music.muted?'Activar música':'Silenciar música')});
document.querySelector('#start').addEventListener('click',e=>{e.stopPropagation();begin()},{once:true});document.addEventListener('click',next);document.addEventListener('touchend',e=>{if(started){e.preventDefault();next()}},{passive:false});
</script></body></html>
