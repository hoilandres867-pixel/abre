<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e8"><title>Para Miau 🌼</title>
<style>
:root{--ink:#453d31;--gold:#d4ad43;--yellow:#f5c928;--yellow2:#ffe978;--green:#66834e;--cream:#fff9e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:radial-gradient(circle at 50% 20%,#fffef9 0,#fff9e8 48%,#f4e5c5 100%);touch-action:manipulation}.veil{position:fixed;inset:0;background:radial-gradient(circle at 50% 58%,transparent 0 28%,#fff9e83b 66%,#ead7ad66 100%);pointer-events:none}.intro{position:fixed;inset:0;display:grid;place-items:center;padding:28px;z-index:30;transition:.8s}.intro.out{opacity:0;transform:scale(1.025);pointer-events:none}.card{text-align:center;width:min(92vw,520px)}h1{font-weight:500;font-size:clamp(31px,8vw,48px);margin:0 0 12px}.lead{font-size:18px;margin:0 0 26px}.start{border:0;border-radius:999px;padding:14px 25px;background:#493f2e;color:#fff;font:600 16px system-ui;box-shadow:0 10px 28px #493f2e2c;cursor:pointer}.sound{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid #d9c9a4;background:#fff9;color:#514735;font-size:18px;backdrop-filter:blur(8px);box-shadow:0 6px 20px #5d4d3018}.sound.muted{opacity:.55}.hidden{display:none!important}
.title{position:fixed;left:50%;top:9vh;transform:translateX(-50%);width:min(88vw,460px);text-align:center;font-size:clamp(21px,5.8vw,29px);line-height:1.35;z-index:20;opacity:0;transition:.5s;text-shadow:0 2px 12px #fff}.title.on{opacity:1}.subhint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:22;font:500 13px system-ui;color:#6d604b;white-space:nowrap;opacity:0;transition:.45s}.subhint.on{opacity:.72}.progress{position:fixed;left:50%;top:calc(22px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:7px;z-index:25;opacity:0;transition:.5s}.progress.on{opacity:1}.dot{width:6px;height:6px;border-radius:8px;background:#cdbf9d;transition:.35s}.dot.done{background:#d3ad42}.dot.active{width:20px;background:#c49c35}
.garden{position:fixed;inset:0;z-index:10;pointer-events:none}.bud{position:absolute;width:62px;height:92px;transform:translate(-50%,-50%) scale(.85);pointer-events:auto;cursor:pointer;filter:drop-shadow(0 6px 6px #6a54281c);animation:budIn .65s cubic-bezier(.2,.9,.2,1) both}.bud:before{content:"";position:absolute;left:29px;top:35px;width:4px;height:57px;border-radius:5px;background:linear-gradient(#78995c,#55743f)}.budhead{position:absolute;left:17px;top:7px;width:29px;height:39px;border-radius:55% 55% 46% 46%;background:linear-gradient(135deg,#ffe878,#efc325);transform:rotate(-4deg);box-shadow:inset -4px -5px 8px #cfa52033}.budleaf{position:absolute;left:28px;top:47px;width:23px;height:12px;border-radius:100% 0 100% 0;background:#718f56;transform:rotate(-25deg)}.bud.pulse{animation:budIn .65s both,pulse 1.8s .7s ease-in-out infinite}@keyframes budIn{from{opacity:0;transform:translate(-50%,-40%) scale(.45)}to{opacity:1;transform:translate(-50%,-50%) scale(.85)}}@keyframes pulse{50%{filter:drop-shadow(0 0 13px #f5c92877);transform:translate(-50%,-50%) scale(.92)}}
.flower{position:fixed;width:58px;height:58px;z-index:12;transform:translate(-50%,-50%) scale(.15);opacity:0;transition:left 1.05s cubic-bezier(.2,.8,.2,1),top 1.05s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.9,.2,1),opacity .45s}.flower.bloom{opacity:1;transform:translate(-50%,-50%) scale(var(--s,1)) rotate(var(--r,0deg))}.flower.settle{z-index:5}.stem{position:absolute;width:5px;height:255px;background:linear-gradient(#79985c,#52733e);border-radius:5px;left:27px;top:44px;transform-origin:top;z-index:-2}.petal{position:absolute;width:27px;height:38px;background:radial-gradient(circle at 50% 20%,var(--yellow2),var(--yellow));border-radius:55% 55% 48% 48%;left:16px;top:8px;transform-origin:50% 21px}.petal:nth-of-type(1){transform:rotate(0) translateY(-16px)}.petal:nth-of-type(2){transform:rotate(60deg) translateY(-16px)}.petal:nth-of-type(3){transform:rotate(120deg) translateY(-16px)}.petal:nth-of-type(4){transform:rotate(180deg) translateY(-16px)}.petal:nth-of-type(5){transform:rotate(240deg) translateY(-16px)}.petal:nth-of-type(6){transform:rotate(300deg) translateY(-16px)}.center{position:absolute;width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a6530,#5b431f);left:17px;top:16px;z-index:2}
.wrap{position:fixed;left:50%;bottom:-300px;transform:translateX(-50%);width:286px;height:292px;transition:1.1s cubic-bezier(.2,.8,.2,1);z-index:6;pointer-events:auto}.wrap.show{bottom:-28px}.paper{position:absolute;inset:0;clip-path:polygon(14% 0,86% 0,69% 100%,31% 100%);background:linear-gradient(135deg,#ead5aa,#fff4da 48%,#dbc293);filter:drop-shadow(0 12px 16px #0002)}.ribbon{position:absolute;left:50%;top:148px;transform:translateX(-50%);width:88px;height:24px;border-radius:50%;background:#c8a158}.ribbon:before,.ribbon:after{content:"";position:absolute;width:55px;height:66px;background:#c8a158;top:10px;clip-path:polygon(0 0,100% 20%,55% 100%)}.ribbon:before{right:41px;transform:rotate(20deg)}.ribbon:after{left:41px;transform:scaleX(-1) rotate(20deg)}.glow{position:fixed;left:50%;bottom:48px;width:330px;height:330px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe16c4a,transparent 68%);opacity:0;transition:1.3s;pointer-events:none}.glow.on{opacity:1}
.cat{position:fixed;left:calc(50% + 70px);bottom:170px;width:57px;height:49px;background:#9b8b7b;border-radius:50% 50% 45% 45%;z-index:8;opacity:0;transform:translateY(25px);transition:.65s;cursor:pointer;pointer-events:none}.cat.peek{opacity:1;transform:translateY(0);pointer-events:auto}.cat:before,.cat:after{content:"";position:absolute;top:-10px;width:20px;height:22px;background:#9b8b7b;clip-path:polygon(50% 0,100% 100%,0 100%)}.cat:before{left:4px}.cat:after{right:4px}.eyes{position:absolute;left:12px;top:18px;width:7px;height:7px;background:#28231f;border-radius:50%;box-shadow:25px 0 #28231f;animation:blink 4.5s infinite}.mouth{position:absolute;left:25px;top:29px;width:8px;height:5px;border-bottom:2px solid #4a4038;border-radius:50%}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.12)}}
.final{position:fixed;inset:0;z-index:18;pointer-events:none;text-align:center;padding:8.5vh 18px 0;background:linear-gradient(#fffaf0e8 0,#fffaf070 34%,transparent 58%);opacity:0;transition:.8s}.final.on{opacity:1}.final>*{opacity:0;transform:translateY(9px)}.final.on h2{animation:reveal .75s .25s forwards}.final.on .day{animation:reveal .75s 1.15s forwards}.final.on .wish{animation:reveal .75s 1.9s forwards}.final.on .sig{animation:reveal .75s 2.55s forwards}@keyframes reveal{to{opacity:1;transform:none}}.final h2{font-size:clamp(28px,7vw,42px);font-weight:500;margin:0 0 9px}.final p{margin:7px;font-size:18px}.final .day{font-size:16px;color:#79673f}.sig{font-style:italic}.secret{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);width:min(88vw,420px);text-align:center;z-index:40;font-size:17px;font-style:italic;opacity:0;transition:.65s;pointer-events:none}.secret.on{opacity:1;transform:translate(-50%,0)}.fall{position:fixed;top:-30px;z-index:2;pointer-events:none;opacity:.55;animation:fall var(--dur) linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(520deg);opacity:.03}}.tapflower{position:fixed;z-index:35;pointer-events:none;font-size:24px;animation:tapBloom 1.5s ease-out forwards}@keyframes tapBloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}25%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(.85) rotate(18deg)}}
@media(max-height:670px){.title{top:6vh}.final{padding-top:5vh}.wrap.show{bottom:-65px}.cat{bottom:132px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div class="veil"></div><div class="glow" id="glow"></div>
<section class="intro" id="intro"><div class="card"><h1>Buenos días, Miau. 🌼</h1><p class="lead">Tengo algo para ti.</p><button class="start" id="start">Comenzar ♫</button></div></section>
<audio id="music" preload="auto" loop src="musica.mp3"></audio><button id="sound" class="sound hidden" aria-label="Silenciar música">♫</button>
<div class="progress" id="progress"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<div class="title" id="title"></div><div class="subhint" id="hint"></div><div class="garden" id="garden"></div>
<div class="wrap" id="wrap"><div class="paper"></div><div class="ribbon"></div></div>
<div class="cat" id="cat" aria-label="Gatito"><i class="eyes"></i><i class="mouth"></i></div>
<section class="final" id="final"><h2>Estas son para ti, Naila. 🌼</h2><p class="day">Feliz Día de las Flores Amarillas, Miau. 🌼</p><p class="wish">Que tengas un día muy bonito. ♡</p><p class="sig">— Sir Gustav</p></section>
<div class="secret" id="secret">P. D. Sí, sigo pensando que tus ojitos son más bonitos. ♡</div>
<script>
const phrases=["Para tus ojitos bonitos.","Para esa sonrisa que me encanta ver.","Para acompañarte un ratito esta mañana.","Y porque hoy también mereces algo bonito."];
const budPos=[[50,55],[31,61],[68,58],[47,65]];
const bouquet=[[-62,-92,.88,-10],[-24,-126,1.02,-4],[22,-130,1.06,4],[64,-94,.88,10],[-82,-54,.82,-15],[-43,-65,.96,-8],[0,-72,1.12,0],[43,-64,.96,8],[82,-52,.82,15],[-61,-20,.84,-12],[-23,-30,.94,-5],[23,-29,.94,5],[60,-18,.84,12]];
const intro=document.querySelector('#intro'),start=document.querySelector('#start'),music=document.querySelector('#music'),sound=document.querySelector('#sound'),garden=document.querySelector('#garden'),title=document.querySelector('#title'),hint=document.querySelector('#hint'),progress=document.querySelector('#progress'),dots=[...document.querySelectorAll('.dot')],wrap=document.querySelector('#wrap'),cat=document.querySelector('#cat'),final=document.querySelector('#final'),glow=document.querySelector('#glow'),secret=document.querySelector('#secret');
let step=0,started=false,finished=false,busy=false,bouquetTaps=0,ambientTimer;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setDots(n){dots.forEach((d,i)=>{d.classList.toggle('done',i<n);d.classList.toggle('active',i===n)})}
function fadeMusic(target=.36,duration=1300){const from=music.volume||0,st=performance.now();function tick(t){const p=Math.min(1,(t-st)/duration);music.volume=from+(target-from)*p;if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function makeFlower(x,y,s=1,r=0){const f=document.createElement('div');f.className='flower';f.style.left=x+'px';f.style.top=y+'px';f.style.setProperty('--s',s);f.style.setProperty('--r',r+'deg');f.innerHTML='<div class="stem"></div>'+Array(6).fill('<i class="petal"></i>').join('')+'<i class="center"></i>';document.body.appendChild(f);requestAnimationFrame(()=>f.classList.add('bloom'));return f}
function makeBud(n){garden.innerHTML='';const b=document.createElement('button');b.className='bud pulse';b.style.left=budPos[n][0]+'%';b.style.top=budPos[n][1]+'%';b.setAttribute('aria-label','Abrir flor');b.innerHTML='<i class="budhead"></i><i class="budleaf"></i>';garden.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();openBud(b,n)},{once:true});hint.textContent='Toca la flor 🌼';hint.classList.add('on')}
async function openBud(b,n){if(busy)return;busy=true;hint.classList.remove('on');b.classList.remove('pulse');const rect=b.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+27;b.style.opacity='0';await sleep(180);b.remove();const f=makeFlower(x,y,1,0);await sleep(360);title.classList.remove('on');await sleep(160);title.textContent=phrases[n];title.classList.add('on');setDots(n);await sleep(1200);const target=bouquet[n];f.style.left=`calc(50% + ${target[0]}px)`;f.style.top=`calc(60% + ${target[1]}px)`;f.style.setProperty('--s',target[2]);f.style.setProperty('--r',target[3]+'deg');f.classList.add('settle');await sleep(1050);step++;if(step<4){setDots(step);makeBud(step);busy=false}else{await finish(f);busy=false}}
function ambientPetal(){if(!started||finished)return;const e=document.createElement('span');e.className='fall';e.textContent='❀';e.style.left=Math.random()*100+'vw';e.style.fontSize=(10+Math.random()*8)+'px';e.style.setProperty('--dur',(6+Math.random()*4)+'s');e.style.setProperty('--drift',(-65+Math.random()*130)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),10500)}
async function finish(){finished=true;clearInterval(ambientTimer);hint.classList.remove('on');title.classList.remove('on');progress.classList.remove('on');await sleep(450);for(let i=4;i<bouquet.length;i++){const p=bouquet[i];const f=makeFlower(innerWidth/2+p[0],innerHeight*.60+p[1],p[2],p[3]);f.classList.add('settle');await sleep(105)}await sleep(350);glow.classList.add('on');wrap.classList.add('show');await sleep(1100);cat.classList.add('peek');await sleep(750);final.classList.add('on');document.body.addEventListener('pointerdown',postTap)}
function postTap(e){if(e.target===sound||e.target===cat)return;const s=document.createElement('span');s.className='tapflower';s.textContent='🌼';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1600);const wr=wrap.getBoundingClientRect();if(e.clientX>wr.left&&e.clientX<wr.right&&e.clientY>wr.top){bouquetTaps++;if(bouquetTaps===5){secret.classList.add('on');setTimeout(()=>secret.classList.remove('on'),4200)}}}
cat.addEventListener('click',e=>{e.stopPropagation();cat.classList.remove('peek');setTimeout(()=>cat.classList.add('peek'),650)});
sound.addEventListener('click',e=>{e.stopPropagation();music.muted=!music.muted;sound.classList.toggle('muted',music.muted);sound.textContent=music.muted?'♩':'♫';sound.setAttribute('aria-label',music.muted?'Activar música':'Silenciar música')});
start.addEventListener('click',async e=>{e.stopPropagation();started=true;intro.classList.add('out');sound.classList.remove('hidden');music.volume=.02;try{await music.play();fadeMusic(.36,1500)}catch{}await sleep(700);intro.classList.add('hidden');progress.classList.add('on');setDots(0);makeBud(0);ambientTimer=setInterval(ambientPetal,950)},{once:true});
</script></body></html>
